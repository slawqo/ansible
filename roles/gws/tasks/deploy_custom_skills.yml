---
- name: "Ensure skills directory exists ({{ _skills_base_dir }})"
  file:
    path: "{{ _skills_base_dir }}"
    state: directory
    mode: '0755'

- name: "Ensure {{ item }} skill directory ({{ _skills_base_dir }})"
  file:
    path: "{{ _skills_base_dir }}/{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ gws_custom_skills }}"

- name: "Deploy {{ item }} skill ({{ _skills_base_dir }})"
  template:
    src: "skills/{{ item }}/SKILL.md.j2"
    dest: "{{ _skills_base_dir }}/{{ item }}/SKILL.md"
    mode: '0644'
  loop: "{{ gws_custom_skills }}"
