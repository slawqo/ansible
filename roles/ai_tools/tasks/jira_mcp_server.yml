---
- name: Ensure Claude Code config directory exists
  file:
    path: "{{ ansible_env.HOME }}/.claude"
    state: directory
    mode: '0755'

- name: Configure Jira MCP server in Claude Code
  script: >-
    update_claude_mcp_settings.py
    jira
    '{{ {"command": "npx", "args": ["-y", "mcp-remote@latest", ai_tools_jira_mcp_url]} | to_json }}'
  args:
    executable: python3
