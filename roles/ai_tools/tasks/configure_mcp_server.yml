---
- name: Ensure Claude Code config directory exists
  file:
    path: "{{ ansible_env.HOME }}/.claude"
    state: directory
    mode: '0755'

- name: "Configure {{ _mcp_server_name }} MCP server in Claude Code"
  script: >-
    update_mcp_settings.py
    ~/.claude.json
    {{ _mcp_server_name }}
    '{{ _mcp_server_config | to_json }}'
  args:
    executable: python3

- name: Ensure Cursor config directory exists
  file:
    path: "{{ ansible_env.HOME }}/.cursor"
    state: directory
    mode: '0755'

- name: "Configure {{ _mcp_server_name }} MCP server in Cursor"
  script: >-
    update_mcp_settings.py
    ~/.cursor/mcp.json
    {{ _mcp_server_name }}
    '{{ _mcp_server_config | to_json }}'
  args:
    executable: python3

- name: Ensure OpenCode config directory exists
  file:
    path: "{{ ai_tools_opencode_config_dir }}"
    state: directory
    mode: '0755'
  when: ai_tools_opencode_enabled

- name: Build OpenCode MCP server configuration
  set_fact:
    _opencode_mcp_config: >-
      {{
        ({
          'type': 'remote',
          'url': _mcp_server_config.url
        })
        if _mcp_server_config.type | default('') == 'http'
        else (
          {
            'type': 'local',
            'command':
              ([_mcp_server_config.command]
              + (_mcp_server_config.args | default([])))
          }
          | combine(
              (_mcp_server_config.env is defined)
              | ternary({'environment': _mcp_server_config.env}, {})
            )
        )
      }}
  when: ai_tools_opencode_enabled

- name: "Configure {{ _mcp_server_name }} MCP server in OpenCode"
  script: >-
    update_mcp_settings.py
    {{ ai_tools_opencode_config_dir }}/opencode.json
    {{ _mcp_server_name }}
    '{{ _opencode_mcp_config | to_json }}'
    mcp
  args:
    executable: python3
  when: ai_tools_opencode_enabled

- name: Ensure Codex config directory exists
  file:
    path: "{{ ai_tools_codex_config_dir }}"
    state: directory
    mode: '0755'
  when: ai_tools_codex_enabled

- name: "Configure {{ _mcp_server_name }} MCP server in Codex"
  blockinfile:
    path: "{{ ai_tools_codex_config_dir }}/config.toml"
    marker: "# {mark} ANSIBLE MANAGED MCP SERVER {{ _mcp_server_name }}"
    block: "{{ lookup('template', 'codex_mcp_server.toml.j2') }}"
    create: true
    mode: '0600'
  when: ai_tools_codex_enabled
