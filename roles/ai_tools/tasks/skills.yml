---
- name: Deploy skills for Claude Code
  include_tasks: deploy_skills.yml
  vars:
    _skills_base_dir: "{{ ansible_env.HOME }}/.claude/skills"

- name: Deploy skills for Cursor
  include_tasks: deploy_skills.yml
  vars:
    _skills_base_dir: "{{ ansible_env.HOME }}/.cursor/skills"

- name: Deploy skills for ChatGPT and Codex
  include_tasks: deploy_skills.yml
  vars:
    _skills_base_dir: "{{ ansible_env.HOME }}/.agents/skills"

- name: Deploy skills for OpenCode
  include_tasks: deploy_skills.yml
  vars:
    _skills_base_dir: "{{ ai_tools_opencode_config_dir }}/skills"
  when: ai_tools_opencode_enabled
