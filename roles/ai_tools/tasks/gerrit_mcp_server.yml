---
- name: Install Gerrit MCP server dependencies
  become: yes
  become_method: sudo
  package:
    name: ['python3', 'python3-pip', 'python3-virtualenv', 'curl']
    state: present

- name: Clone Gerrit MCP server
  git:
    repo: "{{ ai_tools_gerrit_mcp_repo }}"
    version: "{{ ai_tools_gerrit_mcp_version }}"
    dest: "{{ ai_tools_install_dir }}/gerrit-mcp-server"
    accept_hostkey: true
    force: yes
  register: gerrit_mcp_repo

- name: Check if Gerrit MCP server venv exists
  stat:
    path: "{{ ai_tools_install_dir }}/gerrit-mcp-server/.venv"
  register: gerrit_mcp_venv

- name: Build Gerrit MCP server
  shell: ./build-gerrit.sh
  args:
    chdir: "{{ ai_tools_install_dir }}/gerrit-mcp-server"
  when: gerrit_mcp_repo.changed or not gerrit_mcp_venv.stat.exists

- name: Create Gerrit MCP server configuration
  template:
    src: gerrit_config.json.j2
    dest: >-
      {{ ai_tools_install_dir }}/gerrit-mcp-server/gerrit_mcp_server/gerrit_config.json
    mode: '0600'

- name: Configure Gerrit MCP server
  include_tasks: configure_mcp_server.yml
  vars:
    _mcp_server_name: gerrit
    _mcp_server_config:
      command: >-
        {{ ai_tools_install_dir }}/gerrit-mcp-server/.venv/bin/python
      args:
        - >-
          {{ ai_tools_install_dir }}/gerrit-mcp-server/gerrit_mcp_server/main.py
        - stdio
      env:
        PYTHONPATH: "{{ ai_tools_install_dir }}/gerrit-mcp-server/"
