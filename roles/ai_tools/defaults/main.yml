---
ai_tools_install_dir: "{{ ansible_env.HOME }}/.local/share/ai_tools"

# Gerrit MCP Server
ai_tools_gerrit_mcp_enabled: true
ai_tools_gerrit_mcp_repo: 'https://github.com/GerritCodeReview/gerrit-mcp-server.git'
ai_tools_gerrit_mcp_version: 'master'
ai_tools_gerrit_mcp_default_gerrit_url: ''
ai_tools_gerrit_mcp_hosts: []

# Todoist MCP Server
ai_tools_todoist_mcp_enabled: true
ai_tools_todoist_mcp_url: 'https://ai.todoist.net/mcp'

# GitHub MCP Server
ai_tools_github_mcp_enabled: true
ai_tools_github_mcp_token: ''
ai_tools_github_mcp_toolsets: ''
ai_tools_github_mcp_host: ''

# Jira (Atlassian Rovo) MCP Server
ai_tools_jira_mcp_enabled: true
ai_tools_jira_mcp_url: 'https://mcp.atlassian.com/v1/mcp/authv2'

# Karpathy behavioral guidelines (global rules for Claude Code and Cursor)
ai_tools_karpathy_guidelines_enabled: true
ai_tools_karpathy_guidelines_repo: >-
  https://github.com/multica-ai/andrej-karpathy-skills.git
ai_tools_karpathy_guidelines_version: main

# Skills (deployed for both Claude Code and Cursor)
ai_tools_skills_enabled: true

# summarize-reviews skill: projects/repos to watch (changes by others)
ai_tools_skills_summary_gerrit_projects: []
  # - openstack/neutron
ai_tools_skills_summary_github_projects: []
  # - openstack/neutron
ai_tools_skills_summary_gitlab_projects: []
  # - mygroup/myrepo

# make-reviews-plan skill: Todoist destination for code-review tasks
ai_tools_skills_make_reviews_plan_todoist_project: ''
  # - Work
ai_tools_skills_make_reviews_plan_todoist_label: ''
  # - code-review

# wiki skill: Obsidian vault root (when set, deploys wiki skill and creates dirs)
ai_tools_wiki_path: ''
  # - ~/wiki
