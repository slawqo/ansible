---
ai_tools_install_dir: "{{ ansible_env.HOME }}/.local/share/ai_tools"

# Gerrit MCP Server
ai_tools_gerrit_mcp_enabled: true
ai_tools_gerrit_mcp_repo: 'https://github.com/GerritCodeReview/gerrit-mcp-server.git'
ai_tools_gerrit_mcp_version: 'master'
ai_tools_gerrit_mcp_default_gerrit_url: ''
ai_tools_gerrit_mcp_hosts: []
ai_tools_gerrit_mcp_configure_claude_code: true

# Todoist MCP Server
ai_tools_todoist_mcp_enabled: true
ai_tools_todoist_mcp_url: 'https://ai.todoist.net/mcp'

# GitHub MCP Server
ai_tools_github_mcp_enabled: true
ai_tools_github_mcp_token: ''
ai_tools_github_mcp_toolsets: ''
ai_tools_github_mcp_host: ''

# Jira (Atlassian Rovo) MCP Server
ai_tools_jira_mcp_enabled: true
ai_tools_jira_mcp_url: 'https://mcp.atlassian.com/v1/mcp/authv2'

# Claude Code Skills
ai_tools_claude_skills_enabled: true

# summarize-reviews skill: projects/repos to watch (changes by others)
ai_tools_claude_skills_summary_gerrit_projects: []
  # - openstack/neutron
ai_tools_claude_skills_summary_github_projects: []
  # - openstack/neutron
ai_tools_claude_skills_summary_gitlab_projects: []
  # - mygroup/myrepo
