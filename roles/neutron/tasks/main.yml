---
- name: Create /opt/stack directory
  become: yes
  become_method: sudo
  file:
    path=/opt/stack
    state=directory
    mode=0755
    owner={{ ansible_user }}


- name: Clone OpenStack requirements
  git:
      repo=https://opendev.org/openstack/requirements
      dest=/opt/stack/requirements
      version={{ neutron_branch }}


- name: Clone neutron
  git:
      repo=https://github.com/openstack/neutron.git
      dest=/opt/stack/neutron
      version={{ neutron_branch }}


- name: Clone neutron FWaaS
  git:
      repo=https://github.com/openstack/neutron-fwaas.git
      dest=/opt/stack/neutron-fwaas
      version={{ neutron_branch }}
